# Workflow to publish new Hugo generated blog-site to Hostinger
name: Harry's Blog
on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Build blog site
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.136.2'
          # extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy
        run: |
          sshpass -p {{ secrets.SSH_PWD }} scp ./public -r {{ secrets.SSH_USER}}@${{ secrets.SSH_ADDRESS }}:{{ secrets.SSH_PORT }}/public_html
